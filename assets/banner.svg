<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="banner-title banner-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="banner-title">Doma Bharathi: Backend and Full-Stack Developer</title>
  <desc id="banner-desc">Dark navy banner with the name Doma Bharathi and a terminal panel stating: 2 internships completed, 4 projects built, focus on backend and full-stack, next step real-world engineering.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#121B3D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#22D3EE" opacity="0.12"/>
    </pattern>

    <style>
      .name  { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 62px; letter-spacing: -1.5px; fill: #E6EDF3; }
      .role  { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 26px; fill: #22D3EE; }
      .stack { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 17px; fill: #8FA3C0; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; }
      .key   { fill: #8FA3C0; }
      .val   { fill: #E6EDF3; }
      .cmd   { fill: #22D3EE; }

      /* One orchestrated moment: terminal lines appear in sequence, then the cursor blinks.
         Elements are visible by default, so nothing disappears if animations are unsupported. */
      .line   { animation: reveal 0.01s linear both; }
      .l1 { animation-delay: 0.4s; }
      .l2 { animation-delay: 1.0s; }
      .l3 { animation-delay: 1.5s; }
      .l4 { animation-delay: 2.0s; }
      .l5 { animation-delay: 2.5s; }
      .cursor { animation: reveal 0.01s linear 2.5s both, blink 1.1s steps(1) 2.5s infinite; }

      @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink  { 50% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .line, .cursor { animation: none; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#dots)"/>
  <rect width="1000" height="4" fill="url(#accent)"/>

  <!-- Identity -->
  <text x="64" y="132" class="name">Doma Bharathi</text>
  <text x="66" y="180" class="role">Backend &amp; Full-Stack Developer</text>
  <text x="66" y="218" class="stack">Java, Spring Boot, Node.js, React</text>

  <!-- Terminal panel (contains only facts from the resume) -->
  <rect x="570" y="50" width="380" height="200" rx="12" fill="#0B1226" stroke="#24325F" stroke-width="1.5"/>
  <circle cx="594" cy="74" r="5" fill="#3B82F6"/>
  <circle cx="612" cy="74" r="5" fill="#22D3EE"/>
  <circle cx="630" cy="74" r="5" fill="#A78BFA"/>
  <line x1="570" y1="92" x2="950" y2="92" stroke="#24325F" stroke-width="1"/>

  <g class="mono">
    <text x="594" y="124" class="line l1 cmd">$ cat status.txt</text>

    <text x="594" y="154" class="line l2"><tspan class="key">internships</tspan><tspan x="706" class="val">2 completed</tspan></text>
    <text x="594" y="178" class="line l3"><tspan class="key">projects</tspan><tspan x="706" class="val">4 built</tspan></text>
    <text x="594" y="202" class="line l4"><tspan class="key">focus</tspan><tspan x="706" class="val">backend, full-stack</tspan></text>
    <text x="594" y="226" class="line l5"><tspan class="key">next</tspan><tspan x="706" class="val">real-world engineering</tspan></text>

    <rect x="916" y="213" width="8" height="16" fill="#22D3EE" class="cursor"/>
  </g>
</svg>
