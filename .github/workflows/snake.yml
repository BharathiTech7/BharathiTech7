# Generates the contribution snake animation for the profile README.
#
# - Action docs:   https://github.com/Platane/snk
# - Output:        SVG files pushed to a branch named "output" in this repo.
# - README embeds: https://raw.githubusercontent.com/BharathiTech7/BharathiTech7/output/github-snake.svg
#                  https://raw.githubusercontent.com/BharathiTech7/BharathiTech7/output/github-snake-dark.svg

name: Generate contribution snake

on:
  schedule:
    - cron: "0 2 * * *" # every day at 02:00 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab
  push:
    paths:
      - ".github/workflows/snake.yml" # runs once when this file is first pushed or edited

permissions:
  contents: write # needed to push the generated SVGs to the "output" branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake SVGs from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
