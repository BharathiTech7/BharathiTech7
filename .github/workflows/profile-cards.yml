# Generates GitHub stats, top-languages and streak cards as static SVGs
# and commits them to ./profile so the README never depends on a hosted
# third-party endpoint at view time.
#
# - Stats / top languages: https://github.com/stats-organization/github-readme-stats-action
# - Streak:                https://github.com/DenverCoder1/github-readme-streak-stats (Option 2: GitHub Actions)
#
# Colors (hex, no #): background 0D1117 | border 30363D | cyan 22D3EE | violet A78BFA | text C9D1D9

name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab
  push:
    paths:
      - ".github/workflows/profile-cards.yml" # runs once when this file is first pushed or edited

permissions:
  contents: write # needed to commit the generated SVGs

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&bg_color=0D1117&title_color=22D3EE&text_color=C9D1D9&icon_color=A78BFA&border_color=30363D
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true # keep the previous card instead of committing an error card

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&bg_color=0D1117&title_color=22D3EE&text_color=C9D1D9&border_color=30363D
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&background=0D1117&border=30363D&stroke=30363D&ring=22D3EE&fire=A78BFA&currStreakNum=E6EDF3&sideNums=E6EDF3&currStreakLabel=22D3EE&sideLabels=8B9BB4&dates=8B9BB4&timezone=Asia/Kolkata&disable_animations=true
          path: profile/streak.svg

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile cards" || exit 0
          git push
